name: Build Audio Plugins (Windows Only)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      uses: lukka/get-cmake@latest

    - name: Set up MSVC (Windows)
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install WebView2 (Windows)
      shell: pwsh
      run: |
        nuget install Microsoft.Web.WebView2 -OutputDirectory "C:\webview2"
        $webview2Dir = Get-ChildItem "C:\webview2" | Where-Object { $_.Name -like "Microsoft.Web.WebView2*" } | Select-Object -First 1
        echo "WEBVIEW2_PACKAGE=$($webview2Dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: CMake Generate
      shell: bash
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 -DRNBO_EDITOR_MODE=WEBVIEW -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$WEBVIEW2_PACKAGE" -DCMAKE_BUILD_TYPE=Release

    - name: CMake Build
      shell: bash
      run: |
        cmake --build build --config Release --parallel 2

    - name: Upload VST3 Artifact (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: VST3-Windows
        path: build/RNBOAudioPlugin_artefacts/Release/VST3/