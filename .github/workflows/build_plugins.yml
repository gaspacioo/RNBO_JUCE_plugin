name: Build RNBO JUCE Plugins

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up MSVC (Windows Only)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: CMake Configure
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DRNBO_EDITOR_MODE=WEBVIEW -DCMAKE_BUILD_TYPE=${{ env:BUILD_TYPE }}
        else
          cmake -B build -DRNBO_EDITOR_MODE=WEBVIEW -DCMAKE_BUILD_TYPE=${{ env:BUILD_TYPE }}
        fi
      shell: bash

    - name: CMake Build
      run: |
        cmake --build build --config ${{ env:BUILD_TYPE }} --parallel 2

    - name: Upload Artifacts (macOS)
      if: matrix.os == 'macos-latest' && success()
      uses: actions/upload-artifact@v3
      with:
        name: RNBO-Plugin-macOS
        path: build/RNBOAudioPlugin_artefacts/Release/

    - name: Upload Artifacts (Windows)
      if: matrix.os == 'windows-latest' && success()
      uses: actions/upload-artifact@v3
      with:
        name: RNBO-Plugin-Windows
        path: build/RNBOAudioPlugin_artefacts/Release/