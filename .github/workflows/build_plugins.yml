name: Build Audio Plugins (Windows Only)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      uses: lukka/get-cmake@latest

    - name: Set up MSVC (Windows)
      uses: ilammy/msvc-dev-cmd@v1

    - name: CMake Generate
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DRNBO_EDITOR_MODE=WEBVIEW

    - name: CMake Build
      run: |
        cmake --build build

    - name: Upload VST3 Artifact (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: VST3-Windows
        path: build/RNBOAudioPlugin_artefacts/Release/VST3/